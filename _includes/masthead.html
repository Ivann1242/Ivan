<header class="site-header">
  <div class="site-width mast">
    <a class="home-link" href="{{ '/' | relative_url }}" aria-label="Yifan Jing, home"{% if page.url == '/' %} aria-current="page"{% endif %}>
      {% comment %}Official mark from https://umich.edu/includes/panels/gallery/images/block-m-maize.png{% endcomment %}
      <span class="michigan-mark" aria-hidden="true"><img src="{{ '/images/block-m.png' | relative_url }}" alt="" width="290" height="220"></span>
      <span class="home-label">Home</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% elsif page.collection and page.collection == link.collection %} aria-current="location"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button type="button" class="appearance-switch" aria-label="Dark theme" aria-pressed="false" title="Toggle dark theme" hidden>
      <span aria-hidden="true"></span>
    </button>
  </div>
</header>

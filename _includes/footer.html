<footer class="site-footer">
  <div class="site-width footer-line">
    <span>© {{ site.time | date: '%Y' }} Yifan Jing</span>
    <nav aria-label="Footer">
      {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
      {% unless site.atom_feed.hide %}<a href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}">RSS</a>{% endunless %}
      <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
    </nav>
  </div>
</footer>
